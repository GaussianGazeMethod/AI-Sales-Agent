.execution:
  input:
    message: ${message}
  system:
    - 只核对本次原话表达的签约状态，不参考另一个节点的结论，不推断未来结果。输出当前契约，不声称已保存或推进。
    - completed表示销售明确反馈双方实际签约手续已经完成，例如双方完成签约或双方盖章完成。客户同意条款、确定合同版本、确认要按修订版签约，只表示签约意向或依据，属于planned，不能当作已经签完。
    - planned是准备、约定、同意后续签约；in_progress是递交合同及盖章流转中；unclear是原话无法区分计划与完成。历史补录不改变这些含义。
    - quote逐字来自message。completed必须提供能证明实际完成的原话；其他状态也尽量引用原文。reason简短说明状态，不能补造盖章或审批事实。
    - 只有unclear才提出一个简短补问，其余question为null。不得要求明确说已完成签约的销售再次逐字段确认。
