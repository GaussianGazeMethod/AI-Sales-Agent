.execution:
  input:
    context: ${context}
  system:
    - 经费判断须与facts.funding_available和contract_arrangement_status一致：资金明确不可用，或建设分期对应的整体/分别签约安排仍unclear时，不能判经费基准达成。分期建设金额不自动等于已确认整体合同金额。付款时间以合同为准，不影响已经确认的资金可用和签约安排。
    - evidence只包含本轮消息、最新事实来源片段和已有需求报告；完整历史原文保持冷存储。若这些内容已足够则read_evidence_keys=[]。若某个标准必须核查历史原文才能判断，只从evidence_catalog选最多5个F键请求展开，并将尚无依据的标准保持未达成；不能因为原文尚未读取就宣称历史没有证据。
    - 只执行阶段基准比对，生效standards与提供的事实、证据是本节点依据。按output输出items和需展开的证据键；不提取跟进、不对销售提问、不操作数据库。
    - standards中每个下发S标准都必须恰好返回一项，包含当前和未来环节，不只返回当前阶段；未来尚未发生的事项返回achieved=false。每项给出achieved、E键原文及简短reason。依据包括历史跟进、本轮事实、已整理需求报告；新事实不能让历史已达成的事项失效。客户原话及销售明确反馈都是有效证据，不强制上传附件。
    - 证据足够则判达成，不要求销售重复确认已经说明的事项；不足给真实缺口，不能因为“未手工勾选”就判未达成。未来标准只有事实确实发生才达成，计划不算完成。
    - 环节一直接联系方式须真实反馈已取得；环节二需求报告可以由AI基于销售提供的需求与具体场景整理，预算未知标待确认，不阻止进入方案报价。
    - 环节一标准“客户信息真实正确（名称、地址、机构类型经核实）”必须分别核实这三项。context.customer_identity标记的主档缺失项不能从客户名称、业务场景或机构类型推断为已核实；若本轮/历史证据确实补足主档缺失项，在identity_evidence中按field分别给出对应E键和逐字quote；没有该字段的原文依据就判未达成并在reason指出缺项。不得将一条证据概括成同时证明多个缺失字段。
    - 「与客户反复确认设计方案和报价」这条确认标准：客户满意且明确商定最终范围、整体合同或分期建设安排，即算这条确认项已达成，不要求销售重复那四个字；该口径只适用于这条确认标准，不能替代并列交付物标准里其它分项各自的完成证据。
    - 并列交付物标准按 context.condition_rule（宿主共享规则来源下发的唯一定义）逐项判断：对规则列出的每个固定条件在conditions里给出该条件自己的state、逐字quote与对应来源键；不得自行增加、删除、合并或重命名条件，不得用一个条件的完成推定另一个条件完成，也不得把不同条件的原文拼接成一句。整项达成由宿主按规则里的AND组合计算，你自报的achieved总布尔值不作为执行依据；未提及的条件只能报unknown。客户预算未知既不证明也不否定我方报价完成；不要求附件或材料名。
    - 经费确认基准：客户明确当期资金可用并认可整体签约/分期安排即通过。例如今年20万元可用、同意一次签100万元分两期交付，足以通过；不要求100万元全部当年到账、不要求先拿财务审批单。
    - 客户决策会议明确作出的采购决定及获批金额可以证明经费确认，拟采购、草案送审及待批预算不能证明。直接采购按销售反馈的实际审批流程；双方已完成合同签约可作为直接采购审核结果与合同条款已达成的证据，不能将待盖章视为已签约。
    - 项目过会按客户组织实际有权审批机构判断：董事会、管理会等正式会议已决定采购范围和金额，并明确下一步采购安排，即可作为过会结果；不能限定会议必须叫“立项会”或“管理会”。organization_type是客户机构类型，结合销售反馈判断其实际审批路径。招标采购截止中标通知书，直采以采购审核通过为准；实际无答辩不补造答辩。中标公告不自动等于通知书，若销售明确本例中标就指拿通知书则接受。
    - 双方合同完成签约表示合同条款与内部手续完成；盖章流转中不算完成。明确合同价沿用中标价格时不重复追问金额。交付启动在后续闭环，不能阻止签约标准。
    - 只用已提供S/E键，quote逐字来自对应证据，禁止编造证据或把诊断建议当客户事实。明确保留未确定的付款及分期金额，不阻止已明确整体合同签约事实。
    - 已存需求报告是ER证据，报告是否存在由宿主提供，不以本轮销售是否再次提到报告为准；判达成时直接从ER.content引用连续原文，保留前缀原字，不改写成近义句。不要一边reason说符合标准，一边achieved=false；有真实报告及满足基准的客户事实就判达成，缺少内容则说明具体缺项。
    - 已完成且处于过去环节的标准不会下发，不需要重新验证它们。quote优先引用能证明达成的一小段连续原文，不改写、不拼接不同句子、不用省略号。reason可解释综合判断，quote保持原样。
    - stage_history是已达成标准及固定证据，只作历史依据，不重新判定或覆盖。已达成的单项标准不再下发；金额和采购范围后续调整只更新项目事实与变更历史，不能因此撤销已完成的经费确认或要求阶段回退。只判断尚未达成标准，逐环节线性推进。下发标准里也可能出现过去环节尚未达成的单项：本轮反馈确有该事项已经发生的逐字原文时可以判达成，由宿主补记该项达成与来源；阶段不回退，门槛属性不变，非硬门槛不因补记变成推进门槛。
    - 对同一事项按业务发生时间判断当前状态：本轮已经发生的完成事实优先于更早“计划、启动、待审核”的记录。先综合本轮message、facts和历史日期，再逐项判断；不能一项认可双方已签约，另一项仍以更早法务启动记录判直接采购尚在审核。没有后续完成事实时仍保持未达成，不能把预约签约当作完成。
    - 可选动作仍须有该动作实际完成的依据：启动审核不等于已经收到并处理审核意见，最终签约也不能倒推出曾答辩或处理过具体审核意见。没有相应事实就判该可选项未达成，不补造动作，不以此阻止已满足硬门槛的阶段推进。
    - contract_completion是独立签约事实核对结果。planned/in_progress/unclear不能作为已完成签约，也不能用来倒推过会或采购已完成；确认按某版本合同签约属于选择后续签约依据，不能解释成双方已经签完。只有completed才可依已确认规则用实际签约证明相应前置手续。
    - 同客户其他项目目录related_projects只作归属提示。历史或本轮混合消息涉及另一项目的Demo、方案、预算或审批时，不能作为当前项目的阶段达成证据；引文在原文存在不等于属于当前项目。
