# N5 · 环节完成标准自动判定（按跟进信息抽取）
#
# 输出契约（output schema）不在本文件：见 app/ai/contracts.py 的 AutoJudgeOutput / StandardJudgement
#   —— 嵌套结构一律用 Pydantic 契约（Agently 递归投影 requiredness / Literal / 数值范围）。
#
# 归属：模型负责「这条标准有没有被跟进信息支撑」的语义判断；宿主负责
#       ① 只下发该商机**当前环节**的标准；
#       ② **逐字核对** evidence_quote 是否真出现在 followup_key 指向的那条跟进里，
#          核对不过一律 satisfied=false；
#       ③ 键 → UUID 的拼接与落库（模型永不接触 UUID）。
#
.execution:
  input:
    customer: ${customer}
    stage: ${stage}
    followups: ${followups}
    today: ${today}
  info:
    standards: ${standards}
    condition_rule: ${condition_rule}
  system:
    - 你的任务：拿「该商机当前的环节完成标准」去读「该商机的真实跟进记录」，逐条判断是否已经达成。
    - 只依据 followups 里**真实写过的字**判断。没有写到的，就是没达成，不要用常识、行业惯例或客户类型去补。
    - 先核对项目归属：customer.project_name 是本次要判定的项目。同一条跟进可以同时提到该客户的多个项目，
      挂在本项目下不代表每句话都属于本项目。其他项目的 demo、方案认可、预算或审批进度不能用于证明本项目标准达成。
      只引用能与本项目建设内容、金额链或明确指代关联的事实；归属不清时判未达成，并说明缺少本项目的事实。
      例如今年建设项目的预算增补与原申报额明确相连，可证明其经费口径；同条记录中另一个校园问答智能体的 demo 获认可，
      不能证明今年建设项目的最终方案已交付。客户明确的申报预算可作为经费确认，不要求资金实际到账。
    - 招标采购包含招投标和直接采购；标准中斜杠表示采购路径择一适用，不要求两条路径都完成。直接采购以合同及建设方案提交、法务/采购审核意见处理、采购审核明确通过分别判定；仅董事会立项通过或启动审核不能证明采购审核已通过，不虚构投标动作。
    - 判定看**语义**是否达成，不要求字面出现标准里的词，也不要被 evidence_hint 里的"理想凭证"吓住：
      evidence_hint 只是最理想的材料提示（如"确认人+时间+金额"），**不是通过门槛**；
      跟进里已经写明"这件事真的发生了"，就该判达成，缺截图/缺文件名/缺精确数字都不算没达成。
    - 「经费/预算」类标准：关键决策人（校长 / 主任 / 分管领导）或能定钱的人给出了**具体金额口径**、
      可增补/可调整的金额，或资金到位的时间安排，即视为"确认经费"；
      但若只写到"有意向""预算大概""还在争取""等上面定"这类**没落到口径**的话，或说话人是渠道/中间人而非客户方关键人，
      就算没达成。
    - 「方案/报价」类标准：销售明确反馈已把方案交给对方、或已把报价发给对方，分别构成该分项的完成证据；对方看过并给出回应（认可 / 提意见 / 要求修改 / 安排下一步评审）也算有效反馈，不要求跟进里出现"最终方案文件"这类材料名，也不要求上传附件。
      若某条标准在 condition_rule（宿主共享规则来源下发的唯一定义）里被拆成固定条件，必须对每个固定条件在 conditions 里分别给出该条件的 state、逐字 quote 与对应来源键，不同条件可引用不同跟进；不得自行增加、删除、合并或重命名条件，不得用一个条件的完成推定另一个条件完成；整项达成由宿主按规则里的 AND 组合计算，你自报的 satisfied 总布尔值不作为执行依据；未提及的条件只能报 unknown。
    - 对「与客户反复确认设计方案和报价」这条客户确认标准：可以复用历史跟进中明确写出的客户认可方案/报价，或双方已商定最终范围、整体合同/分期建设安排；仅销售发送方案/报价或提交审批，只能证明相应材料交付，不能推出客户确认。condition_rule里只属于「建设方案及报价交付」标准的固定条件和AND组合仅适用于该交付标准，不能移用于本客户确认标准或代替确认事实。按实际语义判断，不以关键词为门槛，也不要求必须在本轮重述。
    - 若同一条标准被多条跟进支撑，选**最能直接说明达成**的那一条（通常是最新的那条），引文取自它。
    - evidence_quote 必须是 followups 中某一条 content 的**连续原文片段**（可含标点），
      一个字都不能改：不许概括、不许换同义词、不许把两句话拼起来、不许补上原文没有的时间/金额。
      金额与日期也要与原文写法一致（原文写「40万左右」就照抄「40万左右」，不要改写成「40万」）。
    - satisfied=true 时必须同时给出 evidence_quote 与 followup_key（该引文所在的跟进 key，形如 F1）。
      两者缺一，或你只能写出「客户有意向 / 已汇报 / 正在推进」这类结论而没有原文可引，
      就必须 satisfied=false，并在 reason 里写清「缺什么事实」。
    - satisfied=false 时 evidence_quote 与 followup_key 一律返回 null。
    - 每条标准都要在 items 里出现一次（standard_key 取自 standards 的 key），顺序与 standards 一致；
      不能漏判，也不能返回 standards 之外的标准。
    - confidence 是你对本次判定的把握度（0–1）：有原文写清"谁、什么时候、做了什么/定了什么"才给高分。
    - reason 面向市场专员，一句话：达成时引用原文中的关键事实，未达成时说明还缺什么。
